version: "v0.4"

project:
  name: "Scheme Properties"
  description: "Reusable Lean theory of single-cover subfunctor and group-object extensions, local scheme properties, components, modules, native rational maps and ring-pullback open immersions. See README.md and docs/Guide.md for exact hypotheses."
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "Original project proofs of reusable scheme-property and module interfaces"
    type: original-proof
    relationship: independently-proves
    note: "Original formal arguments and API design; this entry does not assert complete formalization of any external source."
  - title: "Formal Frontier ring-pullback proof expression"
    type: original-proof
    relationship: adapts
    note: "Adapts earlier Formal Frontier research proofs of the kernel identities and subsequent project proofs of localization, chart descent and restricted Spec arrows, preserving collective contributor credit rather than claiming independent proof authorship. See docs/CREDITS.md and docs/PullbackOpenImmersion.md. No book prose or source-specific coverage is imported."
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    relationship: background
    note: "Mathematical reference for local properties and geometric constructions; no claim of complete passage coverage."
  - title: "Algebraic Groups: The Theory of Group Schemes of Finite Type over a Field"
    authors:
      - J. S. Milne
    type: book
    relationship: adapts
    note: "Definition 5.6 supplies the fat-subfunctor condition using one faithfully flat algebra extension, generalized here to a category and morphism property. Lemma 5.9 and Proposition 5.10 directly inform the single-cover extension statements and Čech-gluing proof idea; the example following Definition 5.6 motivates the unit-power image. Proposition 5.7 is the finite-type antecedent for flat-image density, extended here to locally finite-type field schemes and, for the affine-lifting lemma, arbitrary schemes and base rings under local finite presentation. Corollary 5.11 informs extension of isomorphisms from two dense subfunctors; both inverse laws follow from extension uniqueness. Proposition 5.12 motivates the conditional group-object construction on an exact presheaf, not a represented finite-type group-scheme theorem. The generic categorical extension strengthens the finite-type field formulation. No complete source correspondence or coverage is claimed; reused Formal Frontier and Mathlib expression is credited separately in docs/CREDITS.md."
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - Charles A. Weibel
    type: book
    relationship: adapts
    note: "Chapter I section 5 informs local finite-presentation work; the earlier original project research and its extraction are distinguished in docs/CREDITS.md."
  - title: "mathlib: function-field stalk maps and native rational composition"
    type: software
    relationship: adapts
    note: "Imports upstream mathlib APIs without copying proofs; authentic notices remain upstream and adapted expression is credited in docs/CREDITS.md."
  - title: "mathlib: birational, Jacobson and reduced-spectrum tools"
    type: software
    relationship: adapts
    note: "Imports upstream mathlib APIs without copying proofs; authentic notices remain upstream and adapted expression is credited in docs/CREDITS.md."
  - title: "mathlib: generic stalks and native function-field maps"
    type: software
    relationship: adapts
    note: "Imports upstream mathlib APIs without copying proofs; authentic notices remain upstream and adapted expression is credited in docs/CREDITS.md."
  - title: "mathlib: native partial and rational maps, composition, and topological density"
    type: software
    relationship: adapts
    note: "Imports upstream mathlib APIs without copying proofs; authentic notices remain upstream and adapted expression is credited in docs/CREDITS.md."

