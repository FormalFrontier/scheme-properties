      framework: "Formal Frontier agent-assisted Lean development"
      notes: "AI-assisted Lean proofs, examples and documentation, with mathematical review; no uniform model or cost claim."

status:
  scope: >-
    Extension from one-cover dense subfunctors for morphism classes with relative pullbacks
    and base-change stability, assuming singleton descent only for the target;
    no identity or composition stability or source/subfunctor sheaf condition.
    Isomorphisms between two one-cover dense subfunctors extend uniquely when
    both ambient presheaves satisfy singleton descent, with prescribed
    restrictions and compatibility with identities, inverses and composition.
    A group law on a one-cover-dense subfunctor extends uniquely to a group-object
    law on the exact target presheaf, compatible with inclusion, when the cover
    class admits relative pullbacks and is stable under base change and
    composition and the target satisfies singleton descent. The proper dense
    two-point fixture tests the operations and recovery; no represented group
    scheme or source correspondence is asserted.
    The represented specialization concerns finite-type schemes over a field,
    tested on finitely generated algebras with faithfully flat covers, using
    Mathlib fpqc descent rather than a full induced-site equivalence or Milne's
    ring-level proof. Isomorphisms of two such dense restricted-points subfunctors
    extend uniquely to isomorphisms of finite-type schemes, without affine,
    separated or group hypotheses or a chosen-small-category identification.
    Unit-power images are one-cover dense over any commutative
    base ring for positive exponents; Laurent nonmembership and failure of
    singleton descent require a field and exponent at least two. The zero
    additive subfunctor is not one-cover dense over a field.
    Ring-pullback restricted Spec arrows over arbitrary commutative-ring maps,
    with exact opposite-kernel ranges forming a possibly empty disjoint cover
    of the common-kernel complement. No surjectivity, nontriviality, field or
    finite-type assumption; not unrestricted Spec-map immersions or connected
    components.
    Ring equivalences of independently universed commutative semirings preserve
    reducedness at corresponding prime localizations and openness of the full
    reduced-localization locus. For an injective family of points over an
    arbitrary field, that locus in the square-zero polynomial point quotient
    is open precisely when the family has finite image; no criterion for
    nonseparated families or identification with a particular source ring is asserted.
    Local algebra, finite presentations, components, tensors, dense-open rational maps, relative categories and function fields. Generic-point field maps need no finite-type premise; the chosen-base generic-point rational arrow is noninvertible for a nontrivial Jacobson integral target despite its reversed field-map isomorphism. Inverse reflection requires original-source local finite type, whereas reconstruction requires target-map local finite type. Exact rational inverses require independently dominant quotients; literal chosen-base overness needs the forward quotient base law. No total-scheme isomorphism, unrestricted category equivalence or source-coverage claim. Selected declaration pointers below are not a census; see docs/Guide.md.
