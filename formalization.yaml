# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scheme Properties"
  description: "Lean APIs for local properties of schemes, connected components, finite-étale component schemes, quasicoherent modules, native finite presentations, tensor constructions, dense-open pullback and its controlled-composition closure, controlled partial/rational-map composition, and common-base preservation."
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "Original project proofs of reusable scheme-property and module interfaces"
    type: original-proof
    relationship: independently-proves
    note: "Original formal arguments and API design; this entry does not assert complete formalization of any external source."
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    relationship: background
    note: "Mathematical reference for local properties and geometric constructions; no claim of complete passage coverage."
  - title: "Algebraic Groups: The Theory of Group Schemes of Finite Type over a Field"
    authors:
      - J. S. Milne
    type: book
    relationship: background
    note: "Mathematical context for finite-type points and component schemes; reused Formal Frontier expression is credited separately in CREDITS.md."
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - Charles A. Weibel
    type: book
    relationship: adapts
    note: "Chapter I section 5 informs local finite-presentation work; the earlier original project research and its extraction are distinguished in CREDITS.md."
  - title: "mathlib: native partial and rational maps, composition, and topological density"
    type: software
    relationship: adapts
    note: "Imports native partial/rational-map APIs by Andrew Yang, mathlib density/open-map tools and the existing dense-open pullback module without copying their proof bodies; controlled composition adapts Justus Springer's native Composition proof expression and retains his copyright and Apache-2.0 notice. The common-base proof also adapts original Formal Frontier structure-triangle expression from SchemeProperties/RationalMapComposition.lean at official commit 1af9eb14b0e3a0679cf6eac0ed59e186a4a6c636, with distinct author and transfer credit in CREDITS.md. Dense-open closure adapts Springer's Apache-2.0 partial-composition domain-normalization expression, not his stronger associativity theorem, and retains his individual notice. Controlled associativity adapts Springer's Apache-2.0 partial-composition domain and hom/morphism normalization, retaining his individual notice; its rational-map proof imports Yang's quotient/representative APIs rather than copying their proof bodies. No book prose or selected-source text is copied."

automation:
  methods:
    - method: agent
      framework: "Formal Frontier agent-assisted Lean development"
      notes: "AI agents and maintainers developed Lean code, clients and documentation with mathlib; no uniform model, wall-time or dollar cost is asserted."

