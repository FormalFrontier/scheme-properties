# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scheme Properties"
  description: "Lean APIs for local properties of schemes, connected components, finite-étale component schemes, quasicoherent modules, native finite presentations, tensor constructions, and partial/rational-map dense-open pullback."
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "Original project proofs of reusable scheme-property and module interfaces"
    type: original-proof
    relationship: independently-proves
    note: "Original formal arguments and API design; this entry does not assert complete formalization of any external source."
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    relationship: background
    note: "Mathematical reference for local properties and geometric constructions; no claim of complete passage coverage."
  - title: "Algebraic Groups: The Theory of Group Schemes of Finite Type over a Field"
    authors:
      - J. S. Milne
    type: book
    relationship: background
    note: "Mathematical context for finite-type points and component schemes; reused Formal Frontier expression is credited separately in CREDITS.md."
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - Charles A. Weibel
    type: book
    relationship: adapts
    note: "Chapter I section 5 informs local finite-presentation work; the earlier original project research and its extraction are distinguished in CREDITS.md."
  - title: "mathlib: native partial and rational maps, composition, and topological density"
    type: software
    relationship: background
    note: "Imported native partial/rational-map APIs by Andrew Yang, composition by Justus Springer, and mathlib density/open-map tools; no mathlib proof body or selected-source text is copied."

automation:
  methods:
    - method: agent
      framework: "Formal Frontier agent-assisted Lean development"
      notes: "AI agents and maintainers developed Lean code, clients and documentation with mathlib; no uniform model, wall-time or dollar cost is asserted."

status:
  scope: "Source-independent scheme properties, including five native finite-presentation results, two native relative-composition results, and eight native dense-open pullback results transferred from reviewed isolated incubation; this list records selected contributions, not a whole-library census or a source-coverage decision."
  main_results:
    - declaration: SheafOfModules.Presentation.isFinite_map
      file: SchemeProperties/SheafFinitePresentationTransport.lean
    - declaration: SheafOfModules.Presentation.isFinitePresentation
      file: SchemeProperties/SheafFinitePresentationTransport.lean
    - declaration: AlgebraicGeometry.Scheme.Modules.isFinite_presentationRestrict
      file: SchemeProperties/ModuleFinitePresentation.lean
    - declaration: AlgebraicGeometry.isFinitePresentation_tilde
      file: SchemeProperties/ModuleFinitePresentation.lean
    - declaration: AlgebraicGeometry.Scheme.Modules.exists_isOpenCover_isFinite_presentation
      file: SchemeProperties/ModuleFinitePresentation.lean
    - declaration: AlgebraicGeometry.Scheme.PartialMap.isOver_comp_of_isDominant_first
      file: SchemeProperties/RationalMapComposition.lean
    - declaration: AlgebraicGeometry.Scheme.RationalMap.isOver_comp_of_isDominant_first
      file: SchemeProperties/RationalMapComposition.lean
    - declaration: AlgebraicGeometry.Scheme.PartialMap.PullsDenseOpens
      file: SchemeProperties/DenseOpenPullback.lean
    - declaration: AlgebraicGeometry.Scheme.PartialMap.pullsDenseOpens_iff_of_equiv
      file: SchemeProperties/DenseOpenPullback.lean
    - declaration: AlgebraicGeometry.Scheme.PartialMap.pullsDenseOpens_restrict_iff
      file: SchemeProperties/DenseOpenPullback.lean
    - declaration: AlgebraicGeometry.Scheme.PartialMap.pullsDenseOpens_of_isOpenMap
      file: SchemeProperties/DenseOpenPullback.lean
    - declaration: AlgebraicGeometry.Scheme.PartialMap.pullsDenseOpens_of_isDominant
      file: SchemeProperties/DenseOpenPullback.lean
    - declaration: AlgebraicGeometry.Scheme.RationalMap.PullsDenseOpens
      file: SchemeProperties/DenseOpenPullback.lean
    - declaration: AlgebraicGeometry.Scheme.PartialMap.pullsDenseOpens_toRationalMap_iff
      file: SchemeProperties/DenseOpenPullback.lean
    - declaration: AlgebraicGeometry.Scheme.RationalMap.pullsDenseOpens_representative_iff
      file: SchemeProperties/DenseOpenPullback.lean

review:
  status: self-assessed
  notes: "The preceding 73-module base has separately accepted, verified-release evidence, and the original finite-presentation leaves have independent review. Destination acceptance and publication are recorded separately for exact revisions. This descriptive metadata is not a review certificate, a publication record or a source-complete formalization claim."
