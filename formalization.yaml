# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scheme Properties"
  description: "Lean APIs for local properties of schemes, connected components, finite-étale component schemes, quasicoherent modules, native finite presentations, tensor constructions, dense-open pullback and its dominance companion and controlled-composition closure, controlled partial/rational-map composition and unit laws, common-base preservation, a distinct category of dense-open rational maps and its arbitrary-base relative category, and an integral dominant native rational-map category equivalent to its integral-object rational-arrow full subcategory, and the corresponding arbitrary-base integral-relative equivalence with explicit chosen maps and faithful forgetful comparisons. The native function-field pullback gives contravariant field homomorphisms and a functor on the existing integral dominant rational-map category. The separate function-field faithfulness companion reflects equality of independently dominant native quotient rational maps from equality of their function-field homomorphisms and equips that existing opposite-category functor with an anonymous Faithful instance; no reconstruction or fullness is asserted."
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "Original project proofs of reusable scheme-property and module interfaces"
    type: original-proof
    relationship: independently-proves
    note: "Original formal arguments and API design; this entry does not assert complete formalization of any external source."
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    relationship: background
    note: "Mathematical reference for local properties and geometric constructions; no claim of complete passage coverage."
  - title: "Algebraic Groups: The Theory of Group Schemes of Finite Type over a Field"
    authors:
      - J. S. Milne
    type: book
    relationship: background
    note: "Mathematical context for finite-type points and component schemes; reused Formal Frontier expression is credited separately in CREDITS.md."
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - Charles A. Weibel
    type: book
    relationship: adapts
    note: "Chapter I section 5 informs local finite-presentation work; the earlier original project research and its extraction are distinguished in CREDITS.md."
  - title: "mathlib: function-field stalk maps and native rational composition"
    type: software
    relationship: adapts
    note: "The function-field pullback imports mathlib's quotient/representative interfaces by Andrew Yang and native composition/dominance interfaces by Justus Springer, without copying their proof bodies; their Apache-2.0 and individual notices remain with mathlib. Its integral dominant rational-map category prerequisite is imported from this same Scheme Properties project. Original isolated-incubator authorship, independent review and destination-transfer credit are distinguished in CREDITS.md; no selected-source coverage or new rights clearance is inferred. The companion uses this same-project pullback and its existing integral category plus imported native mathlib APIs; its independent donor-code reviewer, original complete transitive axiom evidence and destination transfer are credited distinctly, without inferring destination checking or selected-source coverage."
  - title: "mathlib: native partial and rational maps, composition, and topological density"
    type: software
    relationship: adapts
    note: "Imports native partial/rational-map APIs by Andrew Yang, mathlib density/open-map tools and the existing dense-open pullback module without copying their proof bodies; the dense-open dominance companion reuses Justus Springer's native dominance API and Yang's quotient/representative APIs without copying their proof bodies; controlled composition adapts Justus Springer's native Composition proof expression and retains his copyright and Apache-2.0 notice. The common-base proof also adapts original Formal Frontier structure-triangle expression from SchemeProperties/RationalMapComposition.lean at official commit 1af9eb14b0e3a0679cf6eac0ed59e186a4a6c636, with distinct author and transfer credit in CREDITS.md. Dense-open closure adapts Springer's Apache-2.0 partial-composition domain-normalization expression, not his stronger associativity theorem, and retains his individual notice. Controlled associativity adapts Springer's Apache-2.0 partial-composition domain and hom/morphism normalization, retaining his individual notice; its rational-map proof imports Yang's quotient/representative APIs rather than copying their proof bodies. The unit laws adapt Springer's Apache-2.0 partial-composition domain and morphism normalization with his individual notice; their rational-map proofs import Yang's native quotient and representative APIs instead of copying their proof bodies. The distinct dense-open rational-map category reuses Yang's native quotient maps and Springer's native composition/dominance interfaces together with the existing controlled dense-open laws, without copying their mathlib proof bodies or changing the ordinary Scheme category. The integral dominant category imports Yang's native quotient and Springer's native composition/dominance interfaces and adapts the independently reviewed integral dense-open comparison using mathlib's ObjectProperty.FullSubcategory and Equivalence interfaces, without copying their proof bodies. No book prose or selected-source text is copied."

automation:
  methods:
    - method: agent
      framework: "Formal Frontier agent-assisted Lean development"
      notes: "AI agents and maintainers developed Lean code, clients and documentation with mathlib; no uniform model, wall-time or dollar cost is asserted."

status:
  scope: "Source-independent scheme properties, including five native finite-presentation results, two native relative-composition results, eight native dense-open pullback results, four partial/rational-map dominance converses and equivalences (the converses require nonempty source and preirreducible target; the equivalences additionally require preirreducible source and nonempty target), eight selected controlled-composition results, two controlled-composition dense-open closure results, two controlled-composition associativity results requiring PullsDenseOpens only on the first two maps, six controlled-composition identity and unit results (left with no second-map predicate, right with a first-map predicate), two common-base preservation results prepared from reviewed isolated incubation, a distinct dense-open rational-map category on arbitrary same-universe scheme wrappers, with an anonymous Category instance and a dominance equivalence only when both schemes are nonempty and preirreducible, an arbitrary-base relative category of chosen total scheme maps and quotient rational arrows with PullsDenseOpens and existential IsOver witnesses, an anonymous Category instance and a faithful (not asserted full) functor to the absolute rational-arrow category, and an integral-object full subcategory of that rational-arrow category equivalent to integral schemes with dominant native quotient rational-map arrows via quotient-preserving functors, natural unit/counit and a triangle law, and for any base scheme an integral-object full subcategory of the relative rational-arrow category equivalent to integral schemes with arbitrary chosen total structure maps and dominant native quotient rational arrows satisfying existential IsOver witnesses, via quotient-preserving functors, natural unit/counit and triangles, with faithful (not asserted full) forgetful functors and natural comparisons to the absolute categories; this list records selected contributions, not a whole-library census, a destination acceptance or a source-coverage decision. The function-field transfer adds a reversed field homomorphism for dominant native quotient arrows between integral schemes and a functor from the opposite integral dominant category; first-arrow-only geometric composition is distinguished from two-arrow dominant ring-map composition. At the original September 30, 2026 transfer preparation before Scheme Properties PR #138's later review, destination checking, review, acceptance and publication of this transfer were pending. This is a historical snapshot, not a later current verdict; consult Scheme Properties PR #138 and Atlas's incubator #285 for subsequent exact-revision evidence and decisions. The separate function-field faithfulness companion establishes equality of independently dominant native quotient rational maps when their function-field maps agree and equips the existing opposite integral dominant category functor with an anonymous Faithful instance; this descriptive addition claims neither fullness/reconstruction nor destination checking, acceptance, publication or source coverage."
