    type: software
    relationship: adapts
    note: "Imports upstream mathlib APIs without copying proofs; authentic notices remain upstream and adapted expression is credited in docs/CREDITS.md."
  - title: "mathlib: native partial and rational maps, composition, and topological density"
    type: software
    relationship: adapts
    note: "Imports upstream mathlib APIs without copying proofs; authentic notices remain upstream and adapted expression is credited in docs/CREDITS.md."

automation:
  methods:
    - method: agent
      framework: "Formal Frontier agent-assisted Lean development"
      notes: "AI-assisted Lean proofs, examples and documentation, with mathematical review; no uniform model or cost claim."

status:
  scope: "Local algebra, finite presentations, components, tensors, dense-open rational maps, relative categories and function fields. Generic-point field maps need no finite-type premise; Jacobson obstruction needs a nontrivial target. Inverse reflection requires original-source local finite type, whereas reconstruction requires target-map local finite type. Exact rational inverses require independently dominant quotients; literal chosen-base overness needs the forward quotient base law. No total-scheme isomorphism, unrestricted category equivalence or source-coverage claim. Selected declaration pointers below are not a census; see docs/Guide.md."
