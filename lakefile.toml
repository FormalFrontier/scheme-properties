name = "scheme-properties"
lintDriver = "batteries/runLinter"
version = "0.1.0"
defaultTargets = ["SchemeProperties", "SchemePropertiesTest", "SchemePropertiesExamples"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "coherent-modules"
git = "https://github.com/FormalFrontier/coherent-modules.git"
rev = "408a52bd54df17ccc928ce970942f1313ff10d5c"

[[require]]
name = "finiteEtaleAlgebras"
git = "https://github.com/FormalFrontier/finite-etale-algebras.git"
rev = "79575f65c9edec560f27756917761eed78331a2a"

[[require]]
name = "multivariate-polynomials"
git = "https://github.com/FormalFrontier/multivariate-polynomials.git"
rev = "602ba00e0d71b83ecc78adebffef1a494b2a47b1"

[[require]]
name = "minimal-primes"
git = "https://github.com/FormalFrontier/minimal-primes.git"
rev = "44b23fb524e62c7f91f7cbe7f07db873cb5c1d66"

# Match Mathlib's resolved Batteries revision, overriding Aesop's nested pin.
[[require]]
name = "batteries"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/batteries"
rev = "4cac2177c37f5530c4da76aa8e4307f3fc9e4dcb"

[[lean_lib]]
name = "SchemeProperties"

[[lean_lib]]
name = "SchemePropertiesTest"
# Test modules intentionally keep their helper declarations private.
leanOptions = { weak.linter.privateModule = false }
roots = ["SchemePropertiesTest.RelativeValuativeExtension"]
globs = ["SchemePropertiesTest.+", "SchemePropertiesTest"]

[[lean_lib]]
name = "SchemePropertiesExamples"
globs = ["SchemePropertiesExamples.+"]

[[require]]
name = "graded-rings"
git = "https://github.com/FormalFrontier/graded-rings.git"
rev = "cb0f2e43578783e926fe8b216d103496d3d93313"
